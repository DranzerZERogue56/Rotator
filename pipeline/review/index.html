<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Marginalia — Candidate Review</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    background: #faf8f4;
    color: #222;
  }
  h1 { font-size: 1.1rem; font-weight: 600; color: #555; }
  #loadScreen { text-align: center; margin-top: 15vh; }
  #counters {
    display: flex;
    gap: 16px;
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    color: #555;
    border-bottom: 1px solid #ddd;
    padding-bottom: 10px;
    margin-bottom: 20px;
  }
  #counters b { color: #111; }
  .hidden { display: none; }
  #card {
    background: #fff;
    border: 1px solid #e2ddd2;
    border-radius: 8px;
    padding: 28px 32px;
  }
  #sourceLine {
    font-family: system-ui, sans-serif;
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 14px;
  }
  #passage {
    font-size: 1.15rem;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  #passage mark {
    background: #ffe9a8;
    padding: 0 2px;
    border-radius: 2px;
  }
  #lessonBlock {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed #ddd;
    font-family: system-ui, sans-serif;
  }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 10px;
    background: #eee;
    color: #555;
    margin-right: 8px;
  }
  .badge.grammar { background: #dbeafe; color: #1e40af; }
  .badge.vocab { background: #dcfce7; color: #166534; }
  .badge.craft { background: #fde7e7; color: #991b1b; }
  #focus { font-weight: 600; }
  #note { margin-top: 8px; color: #333; line-height: 1.5; }
  #vocabList { margin-top: 10px; padding-left: 18px; font-size: 0.9rem; }
  #status {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
  }
  #status.approved { background: #dcfce7; color: #166534; }
  #status.rejected { background: #fee2e2; color: #991b1b; }
  #status.pending { background: #f3f4f6; color: #555; }
  textarea, input[type=text] {
    width: 100%;
    font: inherit;
    padding: 6px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #editArea { margin-top: 14px; }
  #editArea label { display: block; font-family: system-ui, sans-serif; font-size: 0.75rem; color: #666; margin-top: 10px; }
  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid #ddd;
    padding: 12px 20px;
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    display: flex;
    justify-content: center;
    gap: 20px;
    color: #444;
  }
  #controls kbd {
    background: #eee;
    border-radius: 3px;
    padding: 1px 6px;
    font-family: monospace;
  }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 5px;
    border: 1px solid #ccc;
    background: #f5f5f5;
    cursor: pointer;
  }
  button.primary { background: #166534; color: #fff; border-color: #166534; }
  #exportBtn { position: fixed; top: 16px; right: 20px; }
</style>
</head>
<body>

<div id="loadScreen">
  <h1>Marginalia — Candidate Review</h1>
  <p>Select the pipeline's <code>data/candidates.json</code> file to begin.</p>
  <input type="file" id="fileInput" accept="application/json" />
</div>

<div id="reviewScreen" class="hidden">
  <button id="exportBtn">Export approved.json</button>
  <div id="counters"></div>

  <div id="card">
    <div id="sourceLine"></div>
    <div id="passage"></div>

    <div id="lessonBlock">
      <span id="typeBadge" class="badge"></span>
      <span id="focus"></span>
      <span id="status"></span>
      <div id="note"></div>
      <ul id="vocabList"></ul>
    </div>

    <div id="editArea" class="hidden">
      <label>Focus <input type="text" id="editFocus" /></label>
      <label>Note <textarea id="editNote" rows="3"></textarea></label>
      <div id="editVocab"></div>
      <div style="margin-top:12px;">
        <button class="primary" id="saveApproveBtn">Save &amp; Approve (Enter)</button>
        <button id="cancelEditBtn">Cancel (Esc)</button>
      </div>
    </div>
  </div>
</div>

<div id="controls" class="hidden">
  <span><kbd>J</kbd> approve</span>
  <span><kbd>K</kbd> reject</span>
  <span><kbd>E</kbd> edit</span>
  <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> navigate</span>
</div>

<script>
const STORAGE_KEY = "marginalia-review-decisions";

let candidates = [];
let decisions = {};   // id -> { status: "approved" | "rejected", edits: {...} }
let currentIndex = 0;
let editing = false;

function loadDecisions() {
  try {
    decisions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch {
    decisions = {};
  }
}

function saveDecisions() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
  } catch (err) {
    console.error("Could not persist decisions to localStorage", err);
  }
}

function currentCandidate() {
  return candidates[currentIndex];
}

function decisionFor(id) {
  return decisions[id] || { status: "pending", edits: {} };
}

// Splits passage text into { text, highlighted } segments so highlighted
// spans can be wrapped in <mark> without touching the rest of the string.
function renderHighlighted(text, highlights) {
  if (!highlights || highlights.length === 0) return escapeHtml(text);
  const sorted = [...highlights].sort((a, b) => a.start - b.start);
  let cursor = 0;
  let html = "";
  for (const h of sorted) {
    if (h.start < cursor) continue; // overlapping spans — skip, don't double-wrap
    html += escapeHtml(text.slice(cursor, h.start));
    html += "<mark>" + escapeHtml(text.slice(h.start, h.end)) + "</mark>";
    cursor = h.end;
  }
  html += escapeHtml(text.slice(cursor));
  return html;
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function render() {
  const c = currentCandidate();
  if (!c) {
    document.getElementById("card").innerHTML = "<p>All candidates reviewed.</p>";
    return;
  }
  const decision = decisionFor(c.id);
  const focus = decision.edits.focus ?? c.lesson.focus;
  const note = decision.edits.note ?? c.lesson.note;
  const vocabGlosses = decision.edits.vocabGlosses ?? c.vocab.map((v) => v.gloss);

  document.getElementById("sourceLine").textContent =
    `${c.source.title} — ${c.source.author}${c.source.loc ? " — " + c.source.loc : ""}  ·  ${currentIndex + 1} / ${candidates.length}  ·  ${c.id}`;
  document.getElementById("passage").innerHTML = renderHighlighted(c.text, c.lesson.highlights);
  document.getElementById("typeBadge").textContent = c.lesson.type;
  document.getElementById("typeBadge").className = "badge " + c.lesson.type;
  document.getElementById("focus").textContent = focus;
  document.getElementById("note").textContent = note;
  document.getElementById("status").textContent = decision.status;
  document.getElementById("status").className = decision.status;

  const vocabList = document.getElementById("vocabList");
  vocabList.innerHTML = "";
  c.vocab.forEach((v, i) => {
    const li = document.createElement("li");
    li.textContent = `${v.word} — ${vocabGlosses[i] ?? v.gloss}`;
    vocabList.appendChild(li);
  });

  renderCounters();
}

function renderCounters() {
  const counts = { grammar: 0, vocab: 0, craft: 0, approved: 0 };
  for (const c of candidates) {
    if (decisionFor(c.id).status === "approved") {
      counts.approved += 1;
      counts[c.lesson.type] += 1;
    }
  }
  document.getElementById("counters").innerHTML =
    `<span>Approved: <b>${counts.approved}</b> / ${candidates.length}</span>` +
    `<span>Grammar: <b>${counts.grammar}</b></span>` +
    `<span>Vocab: <b>${counts.vocab}</b></span>` +
    `<span>Craft: <b>${counts.craft}</b></span>`;
}

function setDecision(id, status, edits) {
  const existing = decisions[id] || {};
  decisions[id] = { status, edits: edits ?? existing.edits ?? {} };
  saveDecisions();
}

function approve(edits) {
  setDecision(currentCandidate().id, "approved", edits);
  render();
}

function reject() {
  setDecision(currentCandidate().id, "rejected");
  render();
}

function enterEdit() {
  const c = currentCandidate();
  const decision = decisionFor(c.id);
  editing = true;
  document.getElementById("editArea").classList.remove("hidden");
  document.getElementById("editFocus").value = decision.edits.focus ?? c.lesson.focus;
  document.getElementById("editNote").value = decision.edits.note ?? c.lesson.note;

  const vocabGlosses = decision.edits.vocabGlosses ?? c.vocab.map((v) => v.gloss);
  const editVocab = document.getElementById("editVocab");
  editVocab.innerHTML = "";
  c.vocab.forEach((v, i) => {
    const label = document.createElement("label");
    label.textContent = `Gloss for "${v.word}"`;
    const input = document.createElement("input");
    input.type = "text";
    input.className = "vocabGlossInput";
    input.value = vocabGlosses[i] ?? v.gloss;
    label.appendChild(input);
    editVocab.appendChild(label);
  });
  document.getElementById("editFocus").focus();
}

function exitEdit() {
  editing = false;
  document.getElementById("editArea").classList.add("hidden");
}

function saveAndApprove() {
  const c = currentCandidate();
  const edits = {
    focus: document.getElementById("editFocus").value,
    note: document.getElementById("editNote").value,
    vocabGlosses: [...document.querySelectorAll(".vocabGlossInput")].map((el) => el.value),
  };
  exitEdit();
  approve(edits);
}

function goTo(index) {
  if (index < 0 || index >= candidates.length) return;
  if (editing) exitEdit();
  currentIndex = index;
  render();
}

document.getElementById("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  candidates = JSON.parse(await file.text());
  loadDecisions();
  document.getElementById("loadScreen").classList.add("hidden");
  document.getElementById("reviewScreen").classList.remove("hidden");
  document.getElementById("controls").classList.remove("hidden");
  currentIndex = 0;
  render();
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const approved = candidates
    .filter((c) => decisionFor(c.id).status === "approved")
    .map((c) => {
      const edits = decisionFor(c.id).edits;
      return {
        ...c,
        lesson: {
          ...c.lesson,
          focus: edits.focus ?? c.lesson.focus,
          note: edits.note ?? c.lesson.note,
        },
        vocab: c.vocab.map((v, i) => ({
          ...v,
          gloss: (edits.vocabGlosses && edits.vocabGlosses[i]) ?? v.gloss,
        })),
      };
    });
  const blob = new Blob([JSON.stringify(approved, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "approved.json";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("saveApproveBtn").addEventListener("click", saveAndApprove);
document.getElementById("cancelEditBtn").addEventListener("click", exitEdit);

document.addEventListener("keydown", (e) => {
  if (candidates.length === 0) return;

  if (editing) {
    if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") saveAndApprove();
    if (e.key === "Escape") exitEdit();
    return;
  }

  // Ignore shortcut keys if focus somehow landed in a text field outside edit mode.
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

  if (e.key === "j" || e.key === "J") approve();
  else if (e.key === "k" || e.key === "K") reject();
  else if (e.key === "e" || e.key === "E") enterEdit();
  else if (e.key === "ArrowRight" || e.key === "ArrowDown") goTo(currentIndex + 1);
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") goTo(currentIndex - 1);
});
</script>
</body>
</html>
